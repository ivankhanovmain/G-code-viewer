name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Verify version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag must match package.json (v$version)." >&2
            exit 1
          fi
          echo "KONTUR_VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package portable archives
        run: |
          node scripts/package.mjs win32 x64
          node scripts/package.mjs linux x64
          cd out
          windows="Kontur-${KONTUR_VERSION}-win32-x64.zip"
          linux="Kontur-${KONTUR_VERSION}-linux-x64.tar.gz"
          zip -q -r "$windows" Kontur-win32-x64
          tar -czf "$linux" Kontur-linux-x64
          unzip -tq "$windows"
          tar -tzf "$linux" > /dev/null
          sha256sum "$windows" "$linux" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Контур $KONTUR_VERSION" \
            --notes "Распакуйте архив целиком и запустите Kontur.exe в Windows или Kontur в Linux. При запуске откроется демонстрационная программа." \
            "out/Kontur-${KONTUR_VERSION}-win32-x64.zip" \
            "out/Kontur-${KONTUR_VERSION}-linux-x64.tar.gz" \
            out/SHA256SUMS.txt
